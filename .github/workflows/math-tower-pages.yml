name: Verify and publish FACTORxFACTOR
on:
  push:
    branches: [main, release/v524, release/v525]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Rollback: exact previously verified commit on main (blank = current)"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: factorfactor-pages
  cancel-in-progress: false
jobs:
  # Ver.6.12: one build, parallel test shards on the same commit, then a release job that
  # re-derives the public payload, proves it is byte-identical to the tested artifact and
  # hands exactly that artifact to deploy. Deploy needs every shard.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-10-13
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select a main-history rollback only
        if: github.event_name == 'workflow_dispatch' && inputs.source_sha != ''
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python - <<'PY'
          import os,re,subprocess
          sha=os.environ['SOURCE_SHA']
          if not re.fullmatch('[0-9a-f]{40}',sha):raise SystemExit('Exact commit SHA required')
          subprocess.run(['git','merge-base','--is-ancestor',sha,'origin/main'],check=True)
          subprocess.run(['git','checkout','--detach',sha],check=True)
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: python scripts/check-pages-workflow.py
      - run: npm ci
      - name: Verify formal release version
        if: github.event_name != 'workflow_dispatch' || inputs.source_sha == ''
        env:
          RELEASE_BASE: ${{ github.ref == 'refs/heads/main' && github.event.before || 'origin/main' }}
          APPROVED_MAJOR_VERSION: ${{ vars.APPROVED_MAJOR_VERSION }}
        run: node scripts/check-release-version.cjs
      - run: npm run build:pages
      - name: Expose verified release version and commit
        id: release
        run: node -e 'const fs=require("fs"),v=require("./version.json"),sha=require("child_process").execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim();fs.appendFileSync(process.env.GITHUB_OUTPUT,"version="+v.major+"."+v.minor+"\nsha="+sha+"\n")'
      - name: Check committed generated UI
        run: git diff --exit-code -- next-home-ui.js next-results-ui.js game-version.js math-tower-ui.js math-tower-release.js online-rated-ui.js online-spark.js daily-ui.js room-b2-ui.js achievements-audit.js reports/titles_inventory.csv reports/achievements_inventory.csv reports/cosmetics_inventory.csv reports/titles_achievements_cosmetics_audit.md server/online-rated/engine-source.js
      - run: npm run test:version
      - run: npm run test:tower
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-dist
          path: dist
          retention-days: 7
          if-no-files-found: error
  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: online-a
            scripts: test:online-improvements test:regression test:online test:online-rated test:online-entry test:online-menu test:ui-font test:online-presentation
          - shard: online-b
            scripts: test:online-playability test:online-v524 test:online-latency test:bounty-profile test:rating-history test:rating-display test:rewards-audit test:accounts
          - shard: tower
            scripts: test:tower:browser test:tower:rpg test:tower:polish test:tower:flow test:audio test:tower:background test:tower:recovery
          - shard: emulator-artifact
            emulator: true
            scripts: test:chromebook test:ghost
            # The published payload is precompiled (no Babel); these suites run against that exact artifact.
            artifact_scripts: test:regression test:online test:online-entry test:online-menu test:rating-display test:bounty-profile test:ghost test:chromebook
    name: test (${{ matrix.shard }})
    env:
      # Failure evidence: tests/browser-harness.cjs saves screenshots + visible text of pages still open when a browser test fails (mock data only).
      PW_ARTIFACT_DIR: ${{ github.workspace }}/pw-artifacts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-10-13
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: matrix.emulator
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Select installed browser and local snapshot path
        run: node -e 'require("fs").appendFileSync(process.env.GITHUB_ENV,"CHROMIUM_PATH="+require("playwright").chromium.executablePath()+"\nRTDB_RULES_BASELINE_FILE="+process.env.RUNNER_TEMP+"/rtdb-baseline.json\n")'
      - name: Require the approved original rules snapshot
        if: matrix.emulator
        env:
          RULES_JSON: ${{ secrets.RTDB_RULES_BASELINE }}
        run: |
          node - <<'JS'
          const fs=require('fs');
          const s=process.env.RULES_JSON;
          if(!s)throw Error('RTDB_RULES_BASELINE initial setup missing; publication blocked');
          const r=JSON.parse(s);if(!r.rules?.games?.factor)throw Error('Invalid rules export');
          fs.writeFileSync(process.env.RTDB_RULES_BASELINE_FILE,s,{mode:0o600});
          JS
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site-dist
          path: dist
      - name: Browser and unit suites (${{ matrix.shard }})
        env:
          SCRIPTS: ${{ matrix.scripts }}
        run: |
          for s in $SCRIPTS; do echo "::group::npm run $s"; npm run "$s"; echo "::endgroup::"; done
      - name: Actual emulator rules and compatibility
        if: matrix.emulator
        run: |
          npm install --prefix "$RUNNER_TEMP/firebase-cli" --no-audit --no-fund firebase-tools@14.27.0
          "$RUNNER_TEMP/firebase-cli/node_modules/.bin/firebase" emulators:exec --only database --project demo-factorfactor-tower --config firebase/emulator.json "npm run test:ci:rules"
      - name: Spark Auth, matching and ratings in demo emulators only
        if: matrix.emulator
        run: |
          "$RUNNER_TEMP/firebase-cli/node_modules/.bin/firebase" emulators:exec --only auth,database --project demo-factorfactor-tower --config firebase.spark.emulator.json "HTTP_PROXY= http_proxy= node tests/online-spark-emulator.cjs"
      - name: Ghost history, rating isolation and limited-host authorization
        if: matrix.emulator
        run: |
          "$RUNNER_TEMP/firebase-cli/node_modules/.bin/firebase" emulators:exec --only auth,database --project demo-factorfactor-tower --config firebase.spark.emulator.json "HTTP_PROXY= http_proxy= node tests/online-latency-native.cjs && HTTP_PROXY= http_proxy= node tests/ghost-emulator.cjs && HTTP_PROXY= http_proxy= node tests/event-host-emulator.cjs && HTTP_PROXY= http_proxy= node tests/v524-emulator.cjs && HTTP_PROXY= http_proxy= node tests/weekly-next-emulator.cjs"
      - name: Browser suites against the built public artifact
        if: matrix.artifact_scripts
        env:
          SCRIPTS: ${{ matrix.artifact_scripts }}
        run: |
          grep -q 'id="app-source" data-compiled="1">' dist/index.html
          if grep -q 'babel.min.js' dist/index.html; then echo 'published page must not load Babel'; exit 1; fi
          export PW_SITE_ROOT="$GITHUB_WORKSPACE/dist"
          for s in $SCRIPTS; do echo "::group::npm run $s (artifact)"; npm run "$s"; echo "::endgroup::"; done
      - name: Collect browser-test failure evidence
        if: failure()
        run: |
          mkdir -p "$PW_ARTIFACT_DIR"
          ls -la "$PW_ARTIFACT_DIR" > "$PW_ARTIFACT_DIR/index.txt"
      - name: Upload browser-test failure evidence (screenshots and page text; never used for deployment)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: failure-evidence-${{ matrix.shard }}
          path: ${{ github.workspace }}/pw-artifacts
          retention-days: 7
  release:
    needs: [build, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-10-13
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site-dist
          path: verified-dist
      - name: Recheck final public payload and prove it is the tested artifact
        run: |
          node scripts/build-pages.cjs
          diff -r dist verified-dist
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: verified-dist
          retention-days: 30
  deploy:
    needs: [build, release]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.MATH_TOWER_AUTODEPLOY == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5; Pages enablement is manual initial setup
      - name: Deploy verified artifact only
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify live published version
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in {1..12}; do
            site_version="$(curl --fail --silent --show-error --location --max-time 20 "${PAGE_URL%/}/game-version.js?run=${GITHUB_RUN_ID}-${attempt}" || true)"
            if [[ "$site_version" == *"\"number\":\"${EXPECTED_VERSION}\""* ]]; then
              printf 'Live Pages version verified: %s\n' "$EXPECTED_VERSION"
              exit 0
            fi
            sleep 10
          done
          printf '::error::Live Pages version did not match %s\n' "$EXPECTED_VERSION"
          exit 1
